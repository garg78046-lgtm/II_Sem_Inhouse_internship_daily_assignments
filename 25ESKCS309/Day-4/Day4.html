<script>
    function calculateArea(radius) {
        const area = Math.PI * radius * radius;
        return area;
    }

    const radius = 5;
    const circleArea = calculateArea(radius);
    console.log(`Area of the circle with radius ${radius}: ${circleArea}`);
</script>

<script>

const btn = document.querySelector("#myBtn");
btn.addEventListener("click", function() {
    let count = parseInt(btn.dataset.count || 0);
    count++;
    btn.dataset.count = count;
    document.querySelector("#display").textContent = `Clicks: ${count}`;
});

document.querySelector("#nameInput").addEventListener("input", (e) => {

});
